name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install Python dependencies
        run: uv sync

      - name: Run ruff linter
        run: uv run ruff check 

      - name: Run ruff formatter check
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest
